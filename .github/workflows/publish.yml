name: Publish to Maven Central

on:
  release:
    types: [published]
  # Allows re-running a failed upload without cutting a new release.
  workflow_dispatch:

concurrency:
  group: publish-maven-central
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # 17 is what the Kotlin toolchain asks for, 21 runs Gradle itself.
          java-version: |
            17
            21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Check release version
        run: |
          version="$(./gradlew -q properties --property version | sed -n 's/^version: //p')"
          echo "Project version: $version"
          case "$version" in
            "" | *-SNAPSHOT)
              echo "::error::Refusing to publish '$version'; set a release version in gradle.properties first."
              exit 1
              ;;
          esac
          # The version is maintained by hand in gradle.properties, so make sure the
          # release that triggered this run actually refers to it.
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            if [ "$tag" != "$version" ] && [ "$tag" != "v$version" ]; then
              echo "::error::Release tag '$tag' does not match project version '$version'."
              exit 1
            fi
          fi
      - name: Build
        run: ./gradlew build
      - name: Publish to Maven Central
        # Uploads the aggregated deployment bundle; `publishingType = "USER_MANAGED"`
        # means it still has to be released manually from the Central Portal.
        run: ./gradlew publishAggregationToCentralPortal
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
